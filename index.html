<!doctype html>
<html lang="vi" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Ôn Tập TOEIC</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              darkBg: "#020204",
              darkCard: "#0e0e13",
              primary: "#2563eb",
              primaryHover: "#1d4ed8",
            },
          },
        },
      };
    </script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="manifest" href="./manifest.json" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      body {
        background-color: #f8fafc;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .dark body {
        background-color: #020204;
        background-image:
          radial-gradient(1.4px 1.4px at 15px 25px, rgba(255, 255, 255, 0.55), transparent),
          radial-gradient(1px 1px at 65px 90px, rgba(255, 255, 255, 0.35), transparent),
          radial-gradient(1.8px 1.8px at 110px 45px, rgba(255, 255, 255, 0.5), transparent),
          radial-gradient(1px 1px at 150px 120px, rgba(255, 255, 255, 0.3), transparent),
          radial-gradient(1.2px 1.2px at 40px 150px, rgba(255, 255, 255, 0.4), transparent),
          radial-gradient(1px 1px at 180px 20px, rgba(255, 255, 255, 0.35), transparent),
          radial-gradient(1.6px 1.6px at 195px 170px, rgba(255, 255, 255, 0.45), transparent),
          radial-gradient(1px 1px at 5px 190px, rgba(255, 255, 255, 0.3), transparent);
        background-size: 220px 220px;
        background-repeat: repeat;
        background-attachment: fixed;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }

      .dark ::-webkit-scrollbar-thumb {
        background: #475569;
      }

      button:focus,
      select:focus,
      input:focus {
        outline: none;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.5);
      }

      /* ==========================================
           HIỆU ỨNG ĐỘNG (ANIMATIONS)
           ========================================== */
      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(15px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes popIn {
        0% {
          opacity: 0;
          transform: scale(0.8);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }

        20%,
        60% {
          transform: translateX(-5px);
        }

        40%,
        80% {
          transform: translateX(5px);
        }
      }

      @keyframes pulseGlowBlue {
        0% {
          box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5);
        }

        70% {
          box-shadow: 0 0 0 10px rgba(59, 130, 246, 0);
        }

        100% {
          box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
        }
      }

      @keyframes pulseGlowEmerald {
        0% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
        }

        70% {
          box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
        }

        100% {
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
        }
      }

      .animate-slide-up {
        animation: slideInUp 0.4s ease-out forwards;
      }

      .animate-pop-in {
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      .animate-shake {
        animation: shake 0.4s ease-in-out forwards;
      }

      .btn-pulse-blue {
        animation: pulseGlowBlue 1.5s infinite;
      }

      .btn-pulse-emerald {
        animation: pulseGlowEmerald 1.5s infinite;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 6px; /* Độ rộng thanh cuộn siêu mảnh giúp giao diện thanh thoát */
      }

      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent; /* Giữ nền trong suốt để không bị lộ vệt trắng */
      }

      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1; /* Màu Slate-300 nhẹ nhàng ở chế độ giao diện sáng */
        border-radius: 9999px; /* Bo tròn hoàn toàn hai đầu thanh cuộn */
      }

      /* Tự động đổi màu thanh cuộn khi người dùng bật Chế độ tối (Dark Mode) */
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #475569; /* Màu Slate-600 trầm hơn để hợp với nền tối */
      }

      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background-color: #94a3b8; /* Đậm lên một chút khi người dùng di chuột vào để định vị */
      }

      /* ==========================================
   HIỆU ỨNG CHUYỂN CÂU HỎI (PAGE TRANSITION)
   ========================================== */
      @keyframes qFadeInUp {
        from {
          opacity: 0;
          transform: translateY(12px); /* Đẩy nhẹ xuống dưới */
        }
        to {
          opacity: 1;
          transform: translateY(0); /* Trở về vị trí chuẩn */
        }
      }

      /* Class kích hoạt hiệu ứng trong 0.25 giây với chuyển động mượt mà */
      .animate-page-turn {
        animation: qFadeInUp 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
    </style>
  </head>

  <body
    class="min-h-screen flex flex-col font-sans text-slate-800 dark:text-slate-200 transition-colors duration-300"
  >
    <header
      class="w-full bg-white dark:bg-darkCard border-b border-slate-200 dark:border-slate-700 p-4 flex justify-between items-center shadow-sm sticky top-0 z-40"
    >
      <h1
        class="text-xl md:text-2xl font-bold tracking-wide flex items-center gap-2 text-primary dark:text-blue-400"
      >
        <i class="fa-solid fa-graduation-cap animate-pop-in"></i> TOEIC QUIZ
        SYSTEM
      </h1>
      <div class="flex items-center gap-2 md:gap-4">
        <button
          onclick="toggleFocusMode()"
          id="focusModeBtn"
          title="Ẩn sổ tay sửa sai, mở rộng khung làm bài để tập trung hơn"
          class="flex items-center gap-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 px-3 md:px-4 py-2 rounded-lg font-medium transition-colors"
        >
          <i id="focusModeIcon" class="fa-solid fa-expand"></i>
          <span id="focusModeText" class="hidden sm:inline">Tập trung</span>
        </button>
        <button
          onclick="toggleDarkMode()"
          id="themeToggleBtn"
          class="flex items-center gap-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 px-3 md:px-4 py-2 rounded-lg font-medium transition-colors"
        >
          <i id="themeIcon" class="fa-solid fa-moon"></i>
          <span id="themeText" class="hidden sm:inline">Giao diện tối</span>
        </button>
      </div>
    </header>

    <div class="w-full max-w-5xl mx-auto mt-4 px-4">
      <div
        id="settingsPanel"
        class="bg-white dark:bg-darkCard rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm animate-slide-up relative z-50"
      >
        <button
          type="button"
          onclick="toggleSettingsPanel()"
          id="settingsToggleBtn"
          class="w-full flex items-center justify-between gap-3 px-4 py-3 text-left hover:bg-slate-50 dark:hover:bg-slate-800/40 rounded-xl transition-colors"
        >
          <span
            class="flex items-center gap-2 font-bold text-sm text-slate-700 dark:text-slate-200"
          >
            <i class="fa-solid fa-sliders text-primary"></i> Cài đặt đề thi
          </span>
          <i
            id="settingsToggleIcon"
            class="fa-solid fa-chevron-up text-slate-400"
          ></i>
        </button>

        <div
          id="settingsPanelBody"
          class="px-4 pb-4 md:px-6 md:pb-6 flex flex-wrap gap-4 md:gap-6 items-end border-t border-slate-100 dark:border-slate-700/50 pt-4"
        >
        <div class="flex flex-col gap-2 flex-1 min-w-[280px]">
          <label
            class="text-xs font-bold uppercase text-slate-500 dark:text-slate-400 tracking-wider"
          >
            <i class="fa-solid fa-file-lines mr-1"></i> 1. Chọn bài thi
          </label>
          <select
            id="testSelector"
            onchange="loadSelectedTest()"
            class="w-full bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-600 rounded-lg px-4 py-2.5 font-medium cursor-pointer hover:border-primary transition-colors focus:border-primary"
          >
            <option value="data/listen_1_new.json">
              Listening Test 1 (Part 1-4)
            </option>
            <option value="data/listen_2_new.json">
              Listening Test 2 (Part 1-4)
            </option>
            <option value="data/read_1_new.json">
              Reading Test 1 (Part 5-7)
            </option>
            <option value="data/read_2_new.json">
              Reading Test 2 (Part 5-7)
            </option>
          </select>
          <div
            class="text-xs font-medium text-slate-500 dark:text-slate-400"
            id="dataSourceStatus"
          >
            Đang chờ tải dữ liệu...
          </div>
        </div>

        <div class="flex flex-col gap-2 flex-1 min-w-[250px] relative z-50">
          <label
            class="text-xs font-bold uppercase text-slate-500 dark:text-slate-400 tracking-wider"
          >
            <i class="fa-solid fa-list-check mr-1"></i> 2. Lọc theo Parts
          </label>
          <button
            id="chapterDropdownBtn"
            onclick="toggleChapterDropdown()"
            class="w-full bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-600 rounded-lg px-4 py-2.5 font-medium text-left flex justify-between items-center hover:border-primary transition-colors focus:border-primary"
          >
            <span id="chapterDropdownBtnText" class="truncate pr-4"
              >Đang tải cấu trúc...</span
            >
            <i class="fa-solid fa-chevron-down text-slate-400"></i>
          </button>

          <div
            id="chapterDropdownMenu"
            class="hidden absolute left-0 top-[100%] mt-2 z-50 w-full bg-white dark:bg-darkCard border border-slate-200 dark:border-slate-600 rounded-lg shadow-lg max-h-64 overflow-y-auto animate-pop-in"
          >
            <div
              class="p-3 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 sticky top-0 z-10"
            >
              <label
                class="flex items-center gap-3 cursor-pointer font-medium hover:text-primary transition-colors"
              >
                <input
                  type="checkbox"
                  id="selectAllChapters"
                  class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary"
                  checked
                  onchange="toggleAllChapters(this)"
                />
                Chọn tất cả các phần
              </label>
            </div>
            <div id="chapterList" class="p-2 flex flex-col"></div>
          </div>
        </div>

        <div class="flex flex-col justify-end gap-3 min-w-[180px]">
          <label
            class="flex items-center gap-2 cursor-pointer text-sm font-medium hover:text-primary transition-colors select-none py-1"
          >
            <input
              type="checkbox"
              id="randomToggle"
              class="w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary"
              checked
            />
            <i class="fa-solid fa-shuffle text-slate-400"></i> Trộn câu hỏi
          </label>
          <button
            onclick="
              playSound('click');
              applySettings();
            "
            class="bg-primary hover:bg-primaryHover text-white rounded-lg font-bold py-2.5 px-6 flex items-center justify-center gap-2 transition-transform transform hover:scale-105 shadow-md"
          >
            <i class="fa-solid fa-play"></i> Làm Đề Mới
          </button>
        </div>
        </div>
      </div>
    </div>

    <main
      id="app"
      class="w-full max-w-[100rem] mx-auto flex-grow flex items-center justify-center px-1 py-4 md:p-4 mb-10"
    ></main>

    <script src="app.js"></script>


    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) =>
              console.log("Đã cài đặt chế độ Offline thành công!"),
            )
            .catch((err) => console.log("Lỗi cài đặt Offline: ", err));
        });
      }
    </script>
  </body>
</html>
